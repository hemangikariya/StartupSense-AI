version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: startupsense-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=startupsense_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: startupsense-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/startupsense_db
      - JWT_SECRET=super_secret_jwt_key_for_startupsense_development
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - GEMINI_API_KEY=${GEMINI_API_KEY:-REPLACE_ME}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-REPLACE_ME}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: startupsense-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
